[package]
name = "forge-rust-world"
version = "0.1.0"
edition = "2024"
description = "Prototype: Forge's big-world demo on Rust (wgpu + bevy_ecs), to compare with forge_world_demo"
publish = false

[dependencies]
wgpu = "30"
winit = "0.30"
bevy_ecs = { version = "0.20", features = ["multi_threaded"] }
rayon = "1.12"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1"
crossbeam-channel = "0.5"

[profile.release]
debug = 1

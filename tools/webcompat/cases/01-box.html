<!DOCTYPE html>
<html><head><style>
body { margin: 16px; background: #f4f1ea; }
.row { display: flex; gap: 16px; margin-bottom: 16px; }
.b { width: 160px; height: 90px; background: #fff; padding: 10px; box-sizing: border-box; font-size: 14px; }
.a { border: 1px solid #333; }
.c { border: 6px solid #2a7; border-radius: 12px; }
.d { border-width: 2px 8px 14px 4px; border-style: solid; border-color: #c33 #36c #fa0 #3a3; }
.e { border-radius: 45px 10px; background: #1e293b; color: #fff; }
.f { border-radius: 50%; background: #e8b04a; }
.g { padding: 24px 6px 0 40px; background: #dbeafe; }
.h { margin-top: 20px; margin-left: 30px; background: #fde68a; }
.i { background-color: rgba(30, 64, 175, 0.5); border: 3px solid rgba(0,0,0,.25); }
.j { width: 50%; height: 40px; background: #a78bfa; }
.k { min-width: 220px; width: 100px; height: 40px; background: #f472b6; }
.l { max-width: 80px; height: 40px; background: #34d399; }
.m { border: 4px solid #333; border-top-color: transparent; border-radius: 50%; width: 60px; height: 60px; padding: 0; }
.n { outline: 3px solid #f59e0b; outline-offset: 4px; }
</style></head><body>
<div class="row"><div class="b a">1px solid</div><div class="b c">6px radius 12</div><div class="b d">per side widths</div><div class="b e">radius 45/10</div></div>
<div class="row"><div class="b f">50%</div><div class="b g">padding sides</div><div class="b h">margins</div><div class="b i">rgba</div></div>
<div class="j"></div><div class="k"></div><div class="l"></div>
<div class="row" style="margin-top:16px"><div class="b m"></div><div class="b n">outline</div></div>
</body></html>

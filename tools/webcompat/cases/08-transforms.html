<!DOCTYPE html>
<html><head><style>
body { margin: 30px; font-size: 13px; }
.row { display: flex; gap: 50px; margin-bottom: 60px; }
.b { width: 100px; height: 70px; background: #2563eb; color: #fff; padding: 4px; box-sizing: border-box; }
.t1 { transform: rotate(15deg); } .t2 { transform: scale(1.3); } .t3 { transform: translate(20px, 10px); }
.t4 { transform: skewX(-15deg); } .t5 { transform: rotate(-30deg); transform-origin: top left; }
.t6 { transform: scale(0.7) rotate(45deg); } .t7 { transform: perspective(300px) rotateY(35deg); }
.t8 { transform: translateX(-50%); margin-left: 50px; } .t9 { transform: matrix(1, 0.2, 0.3, 1, 0, 0); }
.t10 { transform: scaleX(-1); }
</style></head><body>
<div class="row"><div class="b t1">rotate 15</div><div class="b t2">scale 1.3</div><div class="b t3">translate</div><div class="b t4">skewX</div></div>
<div class="row"><div class="b t5">origin TL</div><div class="b t6">scale+rot</div><div class="b t7">3D rotateY</div><div class="b t8">-50%</div></div>
<div class="row"><div class="b t9">matrix</div><div class="b t10">mirrored</div></div>
</body></html>

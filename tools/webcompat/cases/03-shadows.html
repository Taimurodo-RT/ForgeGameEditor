<!DOCTYPE html>
<html><head><style>
body { margin: 24px; background: #eef2f7; font-size: 14px; }
.row { display: flex; gap: 28px; margin-bottom: 30px; }
.b { width: 150px; height: 90px; background: #fff; border-radius: 12px; padding: 10px; box-sizing: border-box; }
.s1 { box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px 1px rgba(0,0,0,.15); }
.s2 { box-shadow: 0 8px 24px rgba(15,23,42,.25); }
.s3 { box-shadow: inset 0 2px 8px rgba(0,0,0,.35); }
.s4 { box-shadow: 0 0 0 4px #3b82f6; }
.s5 { box-shadow: 0 0 24px 6px #f59e0b; }
.s6 { box-shadow: 12px 12px 0 #0f172a; }
.s7 { box-shadow: 0 0 0 2px #fff, 0 0 0 5px #ef4444, 0 10px 20px rgba(0,0,0,.2); }
.s8 { box-shadow: inset 0 0 0 3px #10b981, inset 0 -20px 30px rgba(16,185,129,.3); }
.t1 { font-size: 34px; font-weight: 700; color: #fff; text-shadow: 2px 2px 0 #1e3a8a; }
.t2 { font-size: 34px; font-weight: 700; color: #222; text-shadow: 0 0 8px #f59e0b; }
.t3 { font-size: 34px; font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.6), 0 0 1px #000; }
</style></head><body>
<div class="row"><div class="b s1">elevation 1</div><div class="b s2">soft</div><div class="b s3">inset</div><div class="b s4">ring</div></div>
<div class="row"><div class="b s5">glow</div><div class="b s6">hard</div><div class="b s7">stacked</div><div class="b s8">inset stack</div></div>
<div class="row"><div class="t1">Shadow</div><div class="t2">Glow</div><div class="t3">Outline</div></div>
</body></html>

<!DOCTYPE html>
<html><head><style>
body { margin: 12px; font-size: 13px; }
.box { position: relative; height: 150px; background: #f1f5f9; margin-bottom: 12px; }
.box div { position: absolute; width: 90px; height: 40px; color: #fff; padding: 4px; box-sizing: border-box; }
.tl { top: 8px; left: 8px; background: #ef4444; } .tr { top: 8px; right: 8px; background: #f59e0b; }
.bl { bottom: 8px; left: 8px; background: #10b981; } .br { bottom: 8px; right: 8px; background: #3b82f6; }
.mid { top: 50%; left: 50%; transform: translate(-50%, -50%); background: #8b5cf6; }
.z { position: relative; height: 110px; }
.z div { position: absolute; width: 120px; height: 70px; color: #fff; padding: 4px; }
.z1 { left: 0; top: 0; background: #0ea5e9; z-index: 3; } .z2 { left: 50px; top: 25px; background: #f43f5e; z-index: 1; } .z3 { left: 100px; top: 10px; background: #22c55e; z-index: 2; }
.ins { position: relative; height: 80px; background: #fef9c3; }
.ins div { position: absolute; inset: 10px 40px; background: #a16207; color: #fff; }
.rel { position: relative; top: 10px; left: 30px; background: #64748b; color: #fff; width: 150px; }
.stretch { position: relative; height: 60px; background: #e2e8f0; margin-top: 20px; }
.stretch div { position: absolute; left: 20px; right: 20px; top: 10px; bottom: 10px; background: #0f172a; color: #fff; }
</style></head><body>
<div class="box"><div class="tl">top-left</div><div class="tr">top-right</div><div class="bl">bottom-left</div><div class="br">bottom-right</div><div class="mid">centered</div></div>
<div class="z"><div class="z1">z 3</div><div class="z2">z 1</div><div class="z3">z 2</div></div>
<div class="ins"><div>inset 10 40</div></div>
<div class="rel">relative +30,+10</div>
<div class="stretch"><div>left+right stretch</div></div>
</body></html>

<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../vendor/bootstrap/bootstrap.css"/><style>body{padding:16px;font-family:Onest}</style></head><body>
<div class="container-fluid"><div class="row g-4"><div class="col-6">
<div class="mb-3"><label class="form-label">Email address</label><input type="email" class="form-control" value="name@example.com"/><div class="form-text">We'll never share your email.</div></div>
<div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control is-invalid" value="12"/><div class="invalid-feedback" style="display:block">Too short.</div></div>
<div class="input-group mb-3"><span class="input-group-text">@</span><input type="text" class="form-control" value="Username"/></div>
<div class="input-group mb-3"><input type="text" class="form-control" value="Search"/><button class="btn btn-outline-secondary">Go</button></div>
</div><div class="col-6">
<div class="form-check"><input class="form-check-input" type="checkbox" checked="checked"/><label class="form-check-label">Checked checkbox</label></div>
<div class="form-check"><input class="form-check-input" type="checkbox"/><label class="form-check-label">Default checkbox</label></div>
<div class="form-check"><input class="form-check-input" type="radio" checked="checked"/><label class="form-check-label">Radio on</label></div>
<div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked="checked"/><label class="form-check-label">Switch on</label></div>
<div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox"/><label class="form-check-label">Switch off</label></div>
<input type="range" class="form-range mb-3"/>
<div class="form-floating mb-3"><input type="text" class="form-control" value="Borin" placeholder="Name"/><label>Floating label</label></div>
<button class="btn btn-primary w-100">Submit</button>
</div></div></div></body></html>

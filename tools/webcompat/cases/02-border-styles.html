<!DOCTYPE html>
<html><head><style>
body { margin: 16px; background: #fff; font-size: 14px; }
.grid { display: flex; flex-wrap: wrap; gap: 14px; }
.b { width: 170px; height: 70px; padding: 8px; box-sizing: border-box; }
.s1 { border: 4px dashed #2563eb; }
.s2 { border: 4px dotted #dc2626; }
.s3 { border: 6px double #16a34a; }
.s4 { border: 2px dashed #111; border-radius: 16px; }
.s5 { border-top: 3px solid #111; border-bottom: 3px dashed #999; }
.s6 { border: 8px groove #aaa; }
.s7 { border: 8px ridge #aaa; }
.s8 { border: 6px inset #888; }
.s9 { border: 6px outset #888; }
.s10 { border: none; background: #eee; }
.s11 { border: 1px solid; color: #9333ea; }
.s12 { border-left: 6px solid #0ea5e9; background: #f0f9ff; }
</style></head><body>
<div class="grid">
<div class="b s1">dashed</div><div class="b s2">dotted</div><div class="b s3">double</div><div class="b s4">dashed round</div>
<div class="b s5">top/bottom</div><div class="b s6">groove</div><div class="b s7">ridge</div><div class="b s8">inset</div>
<div class="b s9">outset</div><div class="b s10">none</div><div class="b s11">currentColor</div><div class="b s12">left accent</div>
</div>
</body></html>

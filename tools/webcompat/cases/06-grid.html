<!DOCTYPE html>
<html><head><style>
body { margin: 12px; font-size: 13px; }
.g { display: grid; gap: 6px; background: #f1f5f9; padding: 6px; margin-bottom: 12px; }
.g div { background: #0d9488; color: #fff; padding: 6px; }
.g1 { grid-template-columns: 100px 1fr 2fr; }
.g2 { grid-template-columns: repeat(4, 1fr); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.g4 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 40px 60px; }
.g4 .wide { grid-column: span 2; } .g4 .tall { grid-row: 1 / 3; grid-column: 3; }
.g5 { grid-template-areas: "head head" "side main" "foot foot"; grid-template-columns: 140px 1fr; }
.g5 .h { grid-area: head; } .g5 .s { grid-area: side; } .g5 .m { grid-area: main; height: 50px; } .g5 .f { grid-area: foot; }
.g6 { grid-template-columns: repeat(3, 80px); justify-content: center; justify-items: center; align-items: center; height: 70px; }
.g6 div { width: 30px; }
</style></head><body>
<div class="g g1"><div>100px</div><div>1fr</div><div>2fr</div></div>
<div class="g g2"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>
<div class="g g3"><div>a</div><div>b</div><div>c</div><div>d</div><div>e</div><div>f</div><div>g</div></div>
<div class="g g4"><div class="wide">span 2</div><div class="tall">rows 1-3</div><div>x</div><div>y</div></div>
<div class="g g5"><div class="h">header</div><div class="s">sidebar</div><div class="m">main</div><div class="f">footer</div></div>
<div class="g g6"><div>c</div><div>c</div><div>c</div></div>
</body></html>

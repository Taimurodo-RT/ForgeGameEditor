<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>HUD</title>
<!-- Made by Forge «Интерфейс» from HUD.json; changes here are overwritten. -->
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  font-family: "Onest";
  font-size: 24px;
  color: #ffffff;
}
#n1 {
  position: relative;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  overflow: hidden;
}
#n5 {
  position: absolute;
  left: calc(50% + -500px);
  width: 1000px;
  top: 12px;
  box-sizing: border-box;
  display: flex;
  flex-direction: row;
  gap: 40px;
  padding: 10px 32px 10px 32px;
  justify-content: center;
  align-items: center;
  background-color: rgba(30, 26, 46, 0.824);
  border-radius: 20px 20px 20px 20px;
}
#n2 {
  position: relative;
  flex-shrink: 0;
  box-sizing: border-box;
  font-size: 34px;
  font-weight: 700;
  line-height: normal;
  text-align: left;
  color: #ffffff;
  white-space: pre;
}
#n3 {
  position: relative;
  flex-shrink: 0;
  box-sizing: border-box;
  font-size: 34px;
  font-weight: 800;
  line-height: normal;
  text-align: left;
  color: #ffd54a;
  white-space: pre;
}
#n4 {
  position: relative;
  flex-shrink: 0;
  box-sizing: border-box;
  font-size: 34px;
  font-weight: 700;
  line-height: normal;
  text-align: left;
  color: #e2def0;
  white-space: pre;
}
html, body, #n1 {
  pointer-events: none;
}
#n5, #n2, #n3, #n4 {
  pointer-events: auto;
}
</style>
</head>
<body>
<div id="n1" class="frame" title="HUD" forge-screen="playing" forge-fit="expand" forge-size="1920 1080">
  <div id="n5" class="frame" title="Счёт">
    <div id="n2" class="text" title="Уровень" forge-text="{board.level_number}. {board.level}">{board.level_number}. {board.level}</div>
    <div id="n3" class="text" title="Очки" forge-text="Очки: {board.score} из {board.target}">Очки: {board.score} из {board.target}</div>
    <div id="n4" class="text" title="Ходы" forge-text="Ходов: {board.moves}">Ходов: {board.moves}</div>
  </div>
</div>
</body>
</html>

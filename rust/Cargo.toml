# Forge on Rust. The C++ engine stays the working version until everything here is ported; see README.md.
[workspace]
resolver = "3"
members = ["crates/forge-world", "crates/forge-input", "crates/forge-ai", "crates/forge-render", "apps/world-demo"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
forge-world = { path = "crates/forge-world" }
forge-input = { path = "crates/forge-input" }
forge-render = { path = "crates/forge-render" }
wgpu = "30"
winit = "0.30"
bevy_ecs = { version = "0.20", features = ["multi_threaded"] }
rayon = "1.12"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1"
crossbeam-channel = "0.5"
log = "0.4"
serde_json = "1"
gilrs = "0.11"

[profile.release]
debug = 1

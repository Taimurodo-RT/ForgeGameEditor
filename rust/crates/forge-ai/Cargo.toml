[package]
name = "forge-ai"
description = "Game AI core: villagers (Utility AI), choice mode, perception and step contract. Logic only, no window or render."
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Without the preserve_order feature: Map stays sorted, see tests/canonical_json.rs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
schemars = "1.2"

      - name: The module «RPG сверху» in the build, then in the package with games/slice, games/platformer, games/rpg and games/modules moved away (rpg scenes on tests/data/rpg, its game made again byte for byte; a bot with the keys through two maps, eight directions at one speed, walls, a slide along them, the elder's quest taken and given back, a pickup once, «Дальше» to the next map and the win, each checked on the screen; a save mid-map continued in another process from another working folder with the hero exactly where he was, broken saves refused, a hero in a wall put at the start, lose() from a dialogue after it ends; two links of one event, the second not run once the first passed the map, with the window «Уровень пройден» and without it, so «Поляна» is won only by its own chest; a next map that does not open leaves the player on his map, playing, saved and loaded again)
        shell: bash
        run: |

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Forge on Rust (rust/), ported module by module while the C++ build below stays the working version.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy, warnings are errors
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests (the generators make the same chunks as C++, tests/data/world_chunks.txt)
        run: cargo test --workspace --locked
      - name: World demo, 3 s headless (streaming and the crowd, no window)
        run: cargo run --release --locked -p forge-world-demo -- --headless 3 --crowd 20000

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # No -G: CMake picks the newest Visual Studio on the runner image.
            configure: ""
            bin: build/{0}/Release
          # Pinned: ubuntu-latest became Ubuntu 26.04 with GCC 15, whose maths differ in the last bits from what the
          # vector, motion and screen tests expect (they check exact numbers). The C++ version only gets fixes now.
          - os: ubuntu-24.04
            # CI machines have no display; SDL builds without X11/Wayland here.
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
            bin: build/{0}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        # mesa-vulkan-drivers: software Vulkan (lavapipe) so rendering can be checked without a GPU.
        run: sudo apt-get update && sudo apt-get install -y ninja-build mesa-vulkan-drivers
      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: The core names no module (engine, the launcher apps/game and the editor include no header of apps/slice or apps/probe; apps/builtin their public headers only)
        shell: bash
        run: if [ "$RUNNER_OS" = Windows ]; then python tools/check_core_includes.py; else python3 tools/check_core_includes.py; fi
      - name: play.py puts games/slice, games/platformer, games/rpg, games/match3 and games/modules back with the same SHA-256 when a move fails first, second, third, fourth or fifth, a game does not start or fails, or one of them does not come back (tools/author_game/test_play.py, a tree of its own)
        shell: bash
        run: if [ "$RUNNER_OS" = Windows ]; then python -m unittest discover -v -s tools/author_game; else python3 -m unittest discover -v -s tools/author_game; fi
      - name: Python for the converters (Linux; Windows builds its own next to the editor)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/pyenv"
          "$RUNNER_TEMP/pyenv/bin/pip" install --disable-pip-version-check -r converters/requirements.txt
          echo "FORGE_PYTHON=$RUNNER_TEMP/pyenv/bin/python" >> "$GITHUB_ENV"
      - name: Converter tests (PSD, Aseprite, sound)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then py=build/python/python.exe; else py="$FORGE_PYTHON"; fi
          "$py" -m unittest discover -s converters/tests -v
      - name: Job system benchmark
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_jobs
      - name: Sandbox, 600 headless frames
        shell: bash
        run: ./${{ format(matrix.bin, 'apps/sandbox') }}/forge_sandbox --headless 600
      - name: World streaming benchmark (64k x 64k, 10 s flight)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_world --frames 600
      - name: Scene benchmark (200k entities in chunks)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_scene
      - name: Sprite batch benchmark (1M sprites, CPU side)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_sprites --frames 100
      - name: Simulation benchmark (200k creatures with logic, bodies, triggers)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_sim --frames 300
      - name: Factory benchmark (10 000 always-on production blocks)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_factory --ticks 300
      - name: Script benchmark (10 000 scripted objects)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_script --frames 300
      - name: World demo, 600 headless frames
        shell: bash
        run: ./${{ format(matrix.bin, 'apps/world_demo') }}/forge_world_demo --headless 600
      - name: Render the world offscreen (software Vulkan)
        if: runner.os == 'Linux'
        run: |
          ./build/apps/world_demo/forge_world_demo --screenshot world-side.png
          ./build/apps/world_demo/forge_world_demo --topdown --screenshot world-top.png
          ./build/apps/render_demo/forge_render_demo --day --sprites 20000 --particles 4000 --zoom 32 --screenshot world-sprites.png
          ./build/apps/render_demo/forge_render_demo --sprites 20000 --particles 4000 --zoom 16 --screenshot world-night.png
          ./build/apps/sim_demo/forge_sim_demo --screenshot world-sim.png
          ./build/apps/factory_demo/forge_factory_demo --screenshot world-factory.png
          ./build/apps/script_demo/forge_script_demo --screenshot world-scripts.png
          ./build/apps/ui_demo/forge_ui_demo --screenshot world-ui-gallery.png
          ./build/apps/ui_demo/forge_ui_demo --theme fantasy --screenshot world-ui-fantasy.png
      - name: UI list of 50 000 rows scrolling (software Vulkan, checks it works, not speed)
        if: runner.os == 'Linux'
        run: ./build/apps/ui_demo/forge_ui_demo --scroll --frames 300 --screenshot world-ui-scroll.png
      - name: Editor self-test (drag, undo/redo, Play/Stop, delete, copy, convert, a new game from a template) and hierarchy of 50 500 objects
        if: runner.os == 'Linux'
        run: |
          ./build/apps/editor/forge_editor --self-test --screenshot world-editor.png
          ./build/apps/editor/forge_editor --bench --frames 300
      - name: Two games of one template (editor self-test part two-games), «Находка» made in A through the tabs, A opened again elsewhere and updated, the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test two-games
      - name: A game of several levels (editor self-test part levels), a second level made, renamed and made the start level through the menu and the window about unsaved changes, one Tiled map name in two levels kept apart byte for byte, opened again elsewhere and each level played, links «уходит через» between them made in «Логика», played through, saved and continued in another process
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test levels
      - name: A platformer made by its author (editor self-test part platformer), an enemy, a coin, spikes and a flag made and set in «Объекты» with undo and redo, put on the level, a zone «Пропасть», links «падает в» and «доходит до» in «Логика», a HUD and the windows «Показывается сам» in «Интерфейс», opened again elsewhere and played as set, the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test platformer
      - name: The catalog's template «Платформер» (editor self-test part platformer-template), games/platformer made again from its sources byte for byte, A and B made of its card in the window «Новая игра», in A the hero's picture replaced in «Ресурсы», the coin's «Очки» and the beetle's «Скорость» in «Объекты», a coin and a bridge on «Луг», the exit's link in «Логика» and the win window's title in «Интерфейс» with undo and redo, opened again elsewhere and played as changed, the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test platformer-template
      - name: Modules (editor self-test part modules), the editor of a game's module from the registry, two modules' levels, values, events and verbs side by side and apart, a game of the test module «Проба» and a game from before step 14.3 (no project.forge, game.json without "module", CRLF) each opened in an editor of its own from another working folder and played with «Играть», the games whose module is none, another, empty or a number or whose frame limit is 0 refused before the open game or its undo is touched, and refused by forge_game and forge_slice
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test modules
      - name: The tab «Анимация» (editor self-test part animation), A and B made of the catalog's «Платформер», in A with the mouse and the keys the beetle's walk, the hero's walk and jump and the flag's two frames, each step's file, undone and done again, a frame the picture has not, «Объекты» undone apart, «Сделать анимацию» of «Ресурсы», opened again elsewhere and played, each frame on the screen as the author's animation has it at that tick, the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test animation
      - name: «Векторная» of the tab «Анимация» (editor self-test part pixel), A and B made of the catalog's «Платформер», in A with the mouse and the keys a vector character made of an SVG of «Ресурсы» (its .pixel.json and pose script beside it), the author's script read again when it changes, the frame size, a clip of 8 frames thirty a second, the clock and «Калька», the pixel view exactly the frame the files bake apart from the tab, a leg's pivot dragged to the hip in the pose shown, a parameter and the seed typed, the game's colours made in «Интерфейс» and an outline, a script that does not compile and one that moves a part the SVG has not (its line, the views on the last pose), an SVG with what ThorVG does not draw named, «Запечь» (12 frames, the .meta, the bake in the file), a picture painted after it not baked over without asking, «Отдать шаблону…» «Герой» (the picture, 12 frames, «Стоит» and «Идёт»), each step undone and done again, «Векторный персонаж» of «Ресурсы»; opened again elsewhere and played (each of the hero's frames on the screen as baked), the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test pixel
      - name: The game's frame limit (editor self-test part frame-limit), A and B made of the catalog's «Платформер», in A with the mouse and the keys a character of 256 × 256 frames baked by «Векторная» into 64 frames, the limit of a game without "frame_limit" («+» and a new clip past it refused and said), a strip 16384 wide, each frame its number as the files bake it, uploaded into the video card and read back byte for byte; «Предел кадров» 65 typed (game.json that field only, Ctrl+Z and Ctrl+Y byte for byte), game.json that cannot be written (66, Ctrl+Z and Ctrl+Y refused and said, the file, the limit, the templates and the history as they were), a 65th frame and its strip of 16640 refused; the limit below the frames taken, 0 and 16385 refused, 64 typed; «Отдать шаблону…» «Флаг»; past the limit refused and said in «Покадровая» and «Объекты»; the limit made 70 in game.json by hand, opened again elsewhere with it and played (each of the flag's 64 frames on the screen as baked), at 63 by hand the game reads the flag as one picture and says so; at 63 in the editor the flag is said, renamed and its frames chosen in «Объекты» and «Покадровая», its file keeping the 64 frames and «Покой» byte for byte but for what the author chose, opened again (the strip of 64 not given to it) and 64 typed gives them back; the limit in «Анимация» and the flag's frames in «Объекты» undone and done again by turns, after each step what reading the files again gives; the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test frame-limit
      - name: The motion tab of «Векторная» (editor self-test part pixel-motion), A and B made of the catalog's «Платформер», in A with the mouse and the keys a clip typed into the code panel and saved, its blocks, flags and log, a line that does not compile (its line in the console, the timeline faint), the player and the timeline (the wheel, F, B, N, the range in the .pixel.json), the flags dragged, a block and its call lit both ways, «Запечь» by the range as the library bakes the files, «Другое зерно» and «Снимок кадра», the script changed outside; «Новый» - a character drawn by its code (its .pixel.json without svg, its parts the draw's ids, a shape typed, a drawing that fails, a parameter, baked as the library bakes), each step undone and done again byte for byte; part 4а - «Знак» drawn by code with skew, stroke, its width, dash, the share drawn, visibility and the order going, their tracks, words and console notes, the values in frames, a value edited in its field and undone byte for byte, baked as the library bakes, given to «Флаг», read again from another folder; part 4б - «Маяк» with a tint, a flash, a blur, a shadow and a mask going, their tracks, words and values in frames, values edited in their fields and undone byte for byte, a flash past 1, a blur under 0 and the mask refused, baked as the library bakes, given to «Флаг», read again from another folder; part 4в - «Тележка» with a cart along a hidden path turning with it and a box to the hook, carried by it and let go, their tracks, words and values in frames, the path's length and timing edited in their fields and undone byte for byte, its value, its drag and the link's edge refused, baked as the library bakes, given to «Флаг», read again from another folder; part 4г - «Искры» with copies of a hidden spark flying out in a fan and one going to it and with it, their tracks after the spark's, words and frames, a copy's block outlining its copy and its length edited for all six and undone byte for byte, a click and a drag on a copy refused, also after the panel is saved by the drag, baked as the library bakes, given to «Флаг», read again from another folder; part 4д - «Ларец» going to a second drawing of its code and back, the drawing's track first and its blocks' words, the tree of the drawing shown before, in and after a swap, a drag in the middle of a swap and the drawing's name refused, the swap's length edited and undone byte for byte, baked as the library bakes, given to «Флаг», read again from another folder; part 4е - shapes drawn with the mouse into «Ларец»'s code (a rect, an ellipse with «Привязка», a line, the pen open and closed, a rect into its second drawing), each undone and done again byte for byte, Esc, no size, the swap and an SVG's picture refused, the colour of new shapes from the eyedropper and typed, a shape's fields typed and refused, a part and its pivot on the grid, in «Узор» a shape of a loop, a colour of an expression and fields in a variable said, the panel saved first, code with an error refused, baked as the library bakes, read again from another folder; part 4ж - «Маятник»'s part fields typed by their three rules (the end of a transition going, a field added to a table going, a line at(…) at the top of the clip) and their refusals, «кривая» from the list of timings, the points of a bezier(…) graph dragged with the mouse, Esc while held, a curve shared by two blocks and a module's curve refused, each undone and done again byte for byte, frames as the formula of cubic-bezier, baked as the library bakes, given to «Флаг», read again from another folder and played in the game; part 5а - «Барабан»'s marks typed into its code (sound(…), emit(…) with a window, one past the range), recorded, shown on the timeline, baked onto the frames of the strip, the window edited and baked again, undone byte for byte, given to «Флаг» and to the hero with their marks, shown in «Покадровая» and kept through its removals, a scheme «При метке анимации» and «Идёт
          mv games/rpg build/rpg-away
          mv games/modules build/modules-away
          trap 'mv build/slice-away games/slice; mv build/platformer-away games/platformer; mv build/rpg-away games/rpg; mv build/modules-away games/modules' EXIT
          "./$packed" --test --scene rpg --data tests/data/rpg/game
          (cd build/elsewhere && "../../$packed" --test --scene rpg_save --data ../../tests/data/rpg/game --user ../rpg-packed)
          (cd build/elsewhere && "../../$packed" --test --scene rpg_continue --data ../../tests/data/rpg/game --user ../rpg-packed)
          for scene in rpg_chain rpg_chain_window rpg_next_broken rpg_next_broken_window; do "./$packed" --test --scene $scene --data tests/data/rpg/game --user build/rpg-links-packed; done

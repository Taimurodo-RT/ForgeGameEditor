          ./build/apps/editor/Release/forge_editor.exe --self-test pixel-motion
          ./build/apps/editor/Release/forge_editor.exe --self-test input
          ./build/apps/editor/Release/forge_editor.exe --self-test rpg-template
          ./build/apps/editor/Release/forge_editor.exe --self-test match3-template
          ./build/apps/editor/Release/forge_editor.exe --self-test images
          ./build/apps/editor/Release/forge_editor.exe --self-test ui-scale
          ./build/apps/editor/Release/forge_editor.exe --self-test vector-live
          python tools/author_game/play.py build/dist/OldMine/OldMine.exe build/apps/game/Release/forge_game.exe build/apps/slice/Release/forge_slice.exe

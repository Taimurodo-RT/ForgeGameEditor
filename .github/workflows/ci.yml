          (cd build/elsewhere && "../../$game" --test --scene match3_continue --data ../../tests/data/match3/game --user ../match3-built)
          mv games/slice build/slice-away
          mv games/platformer build/platformer-away
          mv games/modules build/modules-away
          trap 'mv build/slice-away games/slice; mv build/platformer-away games/platformer; mv build/modules-away games/modules' EXIT
          "./$packed" --test --scene match3 --data tests/data/match3/game
          "./$packed" --test --scene template --data games/match3
          "./$packed" --test --scene match3_lose --data tests/data/match3/game
          "./$packed" --test --scene match3_next --data tests/data/match3/game
          (cd build/elsewhere && "../../$packed" --test --scene match3_save --data ../../tests/data/match3/game --user ../match3-packed)

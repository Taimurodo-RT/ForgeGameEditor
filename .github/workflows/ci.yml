name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # No -G: CMake picks the newest Visual Studio on the runner image.
            configure: ""
            bin: build/{0}/Release
          - os: ubuntu-latest
            # CI machines have no display; SDL builds without X11/Wayland here.
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
            bin: build/{0}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        # mesa-vulkan-drivers: software Vulkan (lavapipe) so rendering can be checked without a GPU.
        run: sudo apt-get update && sudo apt-get install -y ninja-build mesa-vulkan-drivers
      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: The core names no module (engine, the launcher apps/game and the editor include no header of apps/slice or apps/probe; apps/builtin their public headers only)
        shell: bash
        run: if [ "$RUNNER_OS" = Windows ]; then python tools/check_core_includes.py; else python3 tools/check_core_includes.py; fi
      - name: play.py puts games/slice, games/platformer, games/rpg, games/match3 and games/modules back with the same SHA-256 when a move fails first, second, third, fourth or fifth, a game does not start or fails, or one of them does not come back (tools/author_game/test_play.py, a tree of its own)
        shell: bash
        run: if [ "$RUNNER_OS" = Windows ]; then python -m unittest discover -v -s tools/author_game; else python3 -m unittest discover -v -s tools/author_game; fi
      - name: Python for the converters (Linux; Windows builds its own next to the editor)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/pyenv"
          "$RUNNER_TEMP/pyenv/bin/pip" install --disable-pip-version-check -r converters/requirements.txt
          echo "FORGE_PYTHON=$RUNNER_TEMP/pyenv/bin/python" >> "$GITHUB_ENV"
      - name: Converter tests (PSD, Aseprite, sound)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then py=build/python/python.exe; else py="$FORGE_PYTHON"; fi
          "$py" -m unittest discover -s converters/tests -v
      - name: Job system benchmark
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_jobs
      - name: Sandbox, 600 headless frames
        shell: bash
        run: ./${{ format(matrix.bin, 'apps/sandbox') }}/forge_sandbox --headless 600
      - name: World streaming benchmark (64k x 64k, 10 s flight)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_world --frames 600
      - name: Scene benchmark (200k entities in chunks)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_scene
      - name: Sprite batch benchmark (1M sprites, CPU side)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_sprites --frames 100
      - name: Simulation benchmark (200k creatures with logic, bodies, triggers)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_sim --frames 300
      - name: Factory benchmark (10 000 always-on production blocks)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_factory --ticks 300
      - name: Script benchmark (10 000 scripted objects)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_script --frames 300
      - name: World demo, 600 headless frames
        shell: bash
        run: ./${{ format(matrix.bin, 'apps/world_demo') }}/forge_world_demo --headless 600
      - name: Render the world offscreen (software Vulkan)
        if: runner.os == 'Linux'
        run: |
          ./build/apps/world_demo/forge_world_demo --screenshot world-side.png
          ./build/apps/world_demo/forge_world_demo --topdown --screenshot world-top.png
          ./build/apps/render_demo/forge_render_demo --day --sprites 20000 --particles 4000 --zoom 32 --screenshot world-sprites.png
          ./build/apps/render_demo/forge_render_demo --sprites 20000 --particles 4000 --zoom 16 --screenshot world-night.png
          ./build/apps/sim_demo/forge_sim_demo --screenshot world-sim.png
          ./build/apps/factory_demo/forge_factory_demo --screenshot world-factory.png
          ./build/apps/script_demo/forge_script_demo --screenshot world-scripts.png
          ./build/apps/ui_demo/forge_ui_demo --screenshot world-ui-gallery.png
          ./build/apps/ui_demo/forge_ui_demo --theme fantasy --screenshot world-ui-fantasy.png
      - name: UI list of 50 000 rows scrolling (software Vulkan, checks it works, not speed)
        if: runner.os == 'Linux'
        run: ./build/apps/ui_demo/forge_ui_demo --scroll --frames 300 --screenshot world-ui-scroll.png
      - name: Editor self-test (drag, undo/redo, Play/Stop, delete, copy, convert, a new game from a template) and hierarchy of 50 500 objects
        if: runner.os == 'Linux'
        run: |
          ./build/apps/editor/forge_editor --self-test --screenshot world-editor.png
          ./build/apps/editor/forge_editor --bench --frames 300
      - name: Two games of one template (editor self-test part two-games), «Находка» made in A through the tabs, A opened again elsewhere and updated, the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test two-games
      - name: A game of several levels (editor self-test part levels), a second level made, renamed and made the start level through the menu and the window about unsaved changes, one Tiled map name in two levels kept apart byte for byte, opened again elsewhere and each level played, links «уходит через» between them made in «Логика», played through, saved and continued in another process
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test levels
      - name: A platformer made by its author (editor self-test part platformer), an enemy, a coin, spikes and a flag made and set in «Объекты» with undo and redo, put on the level, a zone «Пропасть», links «падает в» and «доходит до» in «Логика», a HUD and the windows «Показывается сам» in «Интерфейс», opened again elsewhere and played as set, the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test platformer
      - name: The catalog's template «Платформер» (editor self-test part platformer-template), games/platformer made again from its sources byte for byte, A and B made of its card in the window «Новая игра», in A the hero's picture replaced in «Ресурсы», the coin's «Очки» and the beetle's «Скорость» in «Объекты», a coin and a bridge on «Луг», the exit's link in «Логика» and the win window's title in «Интерфейс» with undo and redo, opened again elsewhere and played as changed, the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test platformer-template
      - name: Modules (editor self-test part modules), the editor of a game's module from the registry, two modules' levels, values, events and verbs side by side and apart, a game of the test module «Проба» and a game from before step 14.3 (no project.forge, game.json without "module", CRLF) each opened in an editor of its own from another working folder and played with «Играть», the games whose module is none, another, empty or a number or whose frame limit is 0 refused before the open game or its undo is touched, and refused by forge_game and forge_slice
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test modules
      - name: The tab «Анимация» (editor self-test part animation), A and B made of the catalog's «Платформер», in A with the mouse and the keys the beetle's walk, the hero's walk and jump and the flag's two frames, each step's file, undone and done again, a frame the picture has not, «Объекты» undone apart, «Сделать анимацию» of «Ресурсы», opened again elsewhere and played, each frame on the screen as the author's animation has it at that tick, the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test animation
      - name: «Векторная» of the tab «Анимация» (editor self-test part pixel), A and B made of the catalog's «Платформер», in A with the mouse and the keys a vector character made of an SVG of «Ресурсы» (its .pixel.json and pose script beside it), the author's script read again when it changes, the frame size, a clip of 8 frames thirty a second, the clock and «Калька», the pixel view exactly the frame the files bake apart from the tab, a leg's pivot dragged to the hip in the pose shown, a parameter and the seed typed, the game's colours made in «Интерфейс» and an outline, a script that does not compile and one that moves a part the SVG has not (its line, the views on the last pose), an SVG with what ThorVG does not draw named, «Запечь» (12 frames, the .meta, the bake in the file), a picture painted after it not baked over without asking, «Отдать шаблону…» «Герой» (the picture, 12 frames, «Стоит» and «Идёт»), each step undone and done again, «Векторный персонаж» of «Ресурсы»; opened again elsewhere and played (each of the hero's frames on the screen as baked), the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test pixel
      - name: The game's frame limit (editor self-test part frame-limit), A and B made of the catalog's «Платформер», in A with the mouse and the keys a character of 256 × 256 frames baked by «Векторная» into 64 frames, the limit of a game without "frame_limit" («+» and a new clip past it refused and said), a strip 16384 wide, each frame its number as the files bake it, uploaded into the video card and read back byte for byte; «Предел кадров» 65 typed (game.json that field only, Ctrl+Z and Ctrl+Y byte for byte), game.json that cannot be written (66, Ctrl+Z and Ctrl+Y refused and said, the file, the limit, the templates and the history as they were), a 65th frame and its strip of 16640 refused; the limit below the frames taken, 0 and 16385 refused, 64 typed; «Отдать шаблону…» «Флаг»; past the limit refused and said in «Покадровая» and «Объекты»; the limit made 70 in game.json by hand, opened again elsewhere with it and played (each of the flag's 64 frames on the screen as baked), at 63 by hand the game reads the flag as one picture and says so; at 63 in the editor the flag is said, renamed and its frames chosen in «Объекты» and «Покадровая», its file keeping the 64 frames and «Покой» byte for byte but for what the author chose, opened again (the strip of 64 not given to it) and 64 typed gives them back; the limit in «Анимация» and the flag's frames in «Объекты» undone and done again by turns, after each step what reading the files again gives; the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test frame-limit
      - name: The motion tab of «Векторная» (editor self-test part pixel-motion), A and B made of the catalog's «Платформер», in A with the mouse and the keys a clip typed into the code panel and saved, its blocks, flags and log, a line that does not compile (its line in the console, the timeline faint), the player and the timeline (the wheel, F, B, N, the range in the .pixel.json), the flags dragged, a block and its call lit both ways, «Запечь» by the range as the library bakes the files, «Другое зерно» and «Снимок кадра», the script changed outside; «Новый» - a character drawn by its code (its .pixel.json without svg, its parts the draw's ids, a shape typed, a drawing that fails, a parameter, baked as the library bakes), each step undone and done again byte for byte; part 4а - «Знак» drawn by code with skew, stroke, its width, dash, the share drawn, visibility and the order going, their tracks, words and console notes, the values in frames, a value edited in its field and undone byte for byte, baked as the library bakes, given to «Флаг», read again from another folder; part 4б - «Маяк» with a tint, a flash, a blur, a shadow and a mask going, their tracks, words and values in frames, values edited in their fields and undone byte for byte, a flash past 1, a blur under 0 and the mask refused, baked as the library bakes, given to «Флаг», read again from another folder; part 4в - «Тележка» with a cart along a hidden path turning with it and a box to the hook, carried by it and let go, their tracks, words and values in frames, the path's length and timing edited in their fields and undone byte for byte, its value, its drag and the link's edge refused, baked as the library bakes, given to «Флаг», read again from another folder; part 4г - «Искры» with copies of a hidden spark flying out in a fan and one going to it and with it, their tracks after the spark's, words and frames, a copy's block outlining its copy and its length edited for all six and undone byte for byte, a click and a drag on a copy refused, also after the panel is saved by the drag, baked as the library bakes, given to «Флаг», read again from another folder; part 4д - «Ларец» going to a second drawing of its code and back, the drawing's track first and its blocks' words, the tree of the drawing shown before, in and after a swap, a drag in the middle of a swap and the drawing's name refused, the swap's length edited and undone byte for byte, baked as the library bakes, given to «Флаг», read again from another folder; part 4е - shapes drawn with the mouse into «Ларец»'s code (a rect, an ellipse with «Привязка», a line, the pen open and closed, a rect into its second drawing), each undone and done again byte for byte, Esc, no size, the swap and an SVG's picture refused, the colour of new shapes from the eyedropper and typed, a shape's fields typed and refused, a part and its pivot on the grid, in «Узор» a shape of a loop, a colour of an expression and fields in a variable said, the panel saved first, code with an error refused, baked as the library bakes, read again from another folder; the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test pixel-motion
      - name: The tab «Ввод» (editor self-test part input), A and B made of the catalog's «Платформер», in A with the mouse and the keys «Прыжок» on K and without the space, one key on two actions said, Esc taking no key, the gamepad's Y from the list and LB pressed on a gamepad, «Как было», an action without keys said, each step's input.json, undone and done again, opened again elsewhere and played (the hero jumps on K and W, not on the space), the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test input
      - name: The catalog's template «RPG сверху» (editor self-test part rpg-template), games/rpg made again from its sources byte for byte (by the module's maker and by --make-template from another working folder; sources without the elder's picture make nothing and leave the folder as it was), A and B made of its card in the window «Новая игра», in A through the tabs with the mouse and the keys (all of «Сюжет», a name's text, the brush's size and the view, the link's phrase, the HUD's layer and its undo and saving everything by the tabs' own calls) the elder's picture replaced in «Ресурсы» and a sound put there, a conversation in «Сюжет» whose answer gives ten coins once, «Мельник» a copy of the elder saying it, a place «Мельница» seen in the game, the coins' sound the author's in «Объекты», both put on «Деревня» with a second miller beside the road, a conversation added in «Сюжет» after he was put and chosen in his properties back on «Уровень», and a path laid there, «Герой доходит до Мельницы» in «Логика», the miller renamed by the same id, the HUD's hint in «Интерфейс» and the hero's walk in «Анимация», each undone and done again, opened again elsewhere and played as changed (the second miller says his own conversation) and saved after the miller's reward, that save continued by another process from a third working folder (the reward kept and not given again, «Мельница» passes «Деревня», «Поляна» to its chest and the victory), the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test rpg-template
      - name: The catalog's template «Три в ряд» (editor self-test part match3-template), games/match3 made again from its sources byte for byte (by the module's maker and by --make-template from another working folder; sources without «Сапфир»'s picture make nothing and leave the folder as it was), A and B made of its card in the window «Новая игра», in A through the tabs by SDL mouse and key events (the tabs, buttons and the palette by RmlUi's Element::Click; a name after F2, the level panel's numbers, the brush's size, the camera, the link's verb and the link chosen, the UI's screen and layer with their undo, the Resources' folder and row by the tabs' own calls) «Рубин»'s picture replaced in «Ресурсы» and the author's star picture and sound put there, «Звезда» a copy of «Рубин» with them and 50 points, «Рубин» 20 points and «Поле» 3 moves in «Объекты», three stars in a row on «Первый» (the panel's warning, a game of another process refusing that field with the same words), the middle one deleted, a star's «Очки» the template's and not its own, two cells erased and a stone laid, the level's own moves and target, «Третий» on «Поле»'s moves through an undo in «Объекты», «Поле даёт +2 хода за Звезду» with its steps in the module's words and «Поле остаётся без ходов» deleted (the tab's warning) and made again in «Логика», the HUD's moves and the lose window's title in «Интерфейс», the star picture and «Звезда» renamed by the same ids, each undone and done again, opened again elsewhere and played as changed (the author's gems, points, sound, holes, stone, stars, link and HUD) and saved on «Второй» between moves; then «Звезда шахты» chosen with a click and deleted with Delete in «Объекты» (its copies and link stay, «Логика» says the link does not work), Ctrl+S, «Уровень» says «Первый»'s two copies are of an object no more in the game with their cells and the template's key, another editor from another working folder opens the game as saved, says the same and its game refuses «Новая игра» pressed with the mouse with those words on the screen (no save written), a game of another process refuses «Продолжить» pressed with the mouse in its main menu with words on the screen, the saves byte for byte as they were, and Ctrl+Z brings the star back by the same id with its copies, «Уровень» saying nothing; a third editor from a third working folder sees it all as before, its game continues that save by «Продолжить» («Второй» won, «Третий» lost on «Поле»'s 3 moves with the author's title, «Ещё раз») and a new game plays it all again, the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test match3-template
      - name: The tab «Изображения» (editor self-test part images), A and B made of the catalog's «Три в ряд», in A by SDL mouse and key events (strokes, a Shift line, a fill, the picker, the brush keys, the side panel's buttons and fields, Ctrl+Z/Y/S, F5; the tabs and the resource menu by RmlUi's Element::Click; the HUD screen, the Resources' folder, a name after F2 and the window's close request by the editor's own calls) «Рубин»'s picture opened from «Ресурсы» and drawn in frame 1 only, undone and done again, an effect's preview cancelled without writing, the file, its copy and the level as they were until Ctrl+S, a failed write and another program's change refused, saved as WebP, BMP and JPG of new ids, a 2 × 2 sheet made a strip for «Фишка», «Значок очков» inverted for the HUD, a JPG encoded once, the window's close asking about unsaved work; the shared colour picker of 13.4 on both brush colours (a game colour made in «Интерфейс» copied, HEX refused and typed, alpha, «Отмена», Esc and Ctrl+Z giving the colour back with the picture, its file and history untouched, its eyedropper on a pixel) and strokes of those colours in frame 2 kept with their alpha in the file, the game's copy and the game; the game's own pictures shown only (every change refused by buttons, keys and the tab's methods, the project byte for byte), changed, gone and back, a resource of the same name apart, linked to a resource later and still shown only; opened again elsewhere and played by another process with the author's pixels and frames; B's picture of the same name shown in B's own editor (images-b); the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test images
      - name: The UI's scale and SVG pictures at their size on screen (editor self-test part ui-scale), a page of SVG pictures (an <img> in currentColor, a big <img>, a background, a frame of nine parts, an inline <svg>) and a text drawn as the scale goes 1, 1.5, 2 and 1 again on the fly, then 2 and 1 by the window's event of a display's scale (none taken before the event), each picture pixel for pixel as lunasvg draws it straight at that size, the frame's corners pixel for pixel and its edges without seams, the text, its padding and the editor's status bar grown by the scale, a new colour taken by currentColor; «Векторы А» made of the catalog's «Платформер» - three SVG files with Cyrillic names dropped into «Ресурсы» kept as written, a blur filter and a text named in one line at the import and under the preview, on the HUD in «Интерфейс» a picture layer of one from «Ресурсы» (undone, done again) and a rectangle framed by another, Ctrl+S; opened again by another process from another working folder - both drawn on the canvas and in «Проверить» as lunasvg draws the game's copies, played by the game at the screen's size; the picture changed in «Ресурсы» by another program, F5 - the same asset id and copy, the new content in the game, on the canvas and in «Проверить» (nothing kept of the old), played again; «Векторы В» at the display's scales 1, 1.5 and 2 - a row of a list of 1000 files of «Ресурсы» scrolled to by the wheel and clicked where drawn, a rectangle on the canvas found under the mouse, moved and resized by it by the window's pixels, undone; the template and «Векторы Б» byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test ui-scale
      - name: A live SVG picture (editor self-test part vector-live), «Живые А» and «Живые Б» made of the catalog's «Платформер», in A from another working folder - «лицо.svg» with parts named in Russian dropped into «Ресурсы», two picture layers of it on the HUD in «Интерфейс» placed and named, in «Логика» the own scheme of «Табличка» made with the mouse (four nodes from the palette, four wires) - at the start the eyes of one layer go green, each step its mouth morphs into the smile by «Плавность» of «Время мира», a field undone and done again, Ctrl+S; opened again by another process from another working folder - the layers and the scheme as saved, played at the screen's size, twice it and half it - halfway the share is ease(smooth, the world's time) and the picture neither shape, at the end it is drawn as lunasvg draws the file so changed, rasterized at the fit's scale, the other layer the file as it is, no script errors; the SVG changed in «Ресурсы» by another program, F5 - the same asset id, the game's copy new, the mouth morphed into the new smile; «Жук идёт за героем» with the author's own Luau typed into «Код» from the keyboard - in the game it moves, turns, colours, fades and morphs the parts of the other layer and takes it back to its file, drawn as lunasvg draws the file so changed, the first layer and the asset untouched; closed to the main menu and gone on with «Продолжить» - both layers their files again, then the first as the scheme says each step; the template and «Живые Б» byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test vector-live
      - name: Vertical slice self-test (plays the game through, saves and loads) and stress run
        if: runner.os == 'Linux'
        run: |
          ./build/apps/slice/forge_slice --test --screenshot world-slice-village.png
          ./build/apps/slice/forge_slice --test --scene mine --screenshot world-slice-mine.png
          ./build/apps/slice/forge_slice --test --scene menu --screenshot world-slice-menu.png
          ./build/apps/slice/forge_slice --test --scene menu --size 2560x1080 --screenshot world-slice-menu-21x9.png
          ./build/apps/slice/forge_slice --stress --test --scene stress --screenshot world-slice-stress.png
          ./build/apps/slice/forge_slice --test --scene windows --screenshot world-slice-windows.png
          ./build/apps/slice/forge_slice --test --scene templates --screenshot world-slice-templates.png
          ./build/apps/slice/forge_slice --test --scene volumes
          ./build/apps/slice/forge_slice --test --scene physics --screenshot world-slice-physics.png
          ./build/apps/slice/forge_slice --test --scene light --screenshot world-slice-light.png
          ./build/apps/slice/forge_slice --test --scene light --size 1920x1080 --screenshot world-slice-light-1080p.png
          ./build/apps/slice/forge_slice --test --scene zones --screenshot world-slice-zones.png
          ./build/apps/slice/forge_slice --test --scene own_tiles --screenshot world-slice-own-tiles.png
          ./build/apps/slice/forge_slice --test --scene own_tiles --size 1920x1080 --screenshot world-slice-own-tiles-1080p.png
          ./build/apps/slice/forge_slice --test --scene tiled --screenshot world-slice-tiled.png
          ./build/apps/slice/forge_slice --test --scene tiled_update --screenshot world-slice-tiled-update.png
      - name: Package the vertical slice
        run: cmake --build build --config Release --target forge_slice_package
      - name: Packaged game finds its data, the windows and templates examples' pages, the physics, light, zones and Tiled examples' levels in it and plays a level of its own tiles
        if: runner.os == 'Linux'
        run: |
          ./build/dist/OldMine/OldMine --test --scene menu --screenshot world-slice-packaged.png
          ./build/dist/OldMine/OldMine --test --scene menu --size 1440x1080 --screenshot world-slice-packaged-4x3.png
          ./build/dist/OldMine/OldMine --test --scene windows --screenshot world-slice-packaged-windows.png
          ./build/dist/OldMine/OldMine --test --scene templates --screenshot world-slice-packaged-templates.png
          ./build/dist/OldMine/OldMine --test --scene volumes
          ./build/dist/OldMine/OldMine --test --scene physics --screenshot world-slice-packaged-physics.png
          ./build/dist/OldMine/OldMine --test --scene light --screenshot world-slice-packaged-light.png
          ./build/dist/OldMine/OldMine --test --scene light --size 1920x1080 --screenshot world-slice-packaged-light-1080p.png
          ./build/dist/OldMine/OldMine --test --scene zones --screenshot world-slice-packaged-zones.png

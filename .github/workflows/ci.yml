name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # No -G: CMake picks the newest Visual Studio on the runner image.
            configure: ""
            bin: build/{0}/Release
          - os: ubuntu-latest
            # CI machines have no display; SDL builds without X11/Wayland here.
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
            bin: build/{0}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        # mesa-vulkan-drivers: software Vulkan (lavapipe) so rendering can be checked without a GPU.
        run: sudo apt-get update && sudo apt-get install -y ninja-build mesa-vulkan-drivers
      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: The core names no module (engine, the launcher apps/game and the editor include no header of apps/slice or apps/probe; apps/builtin their public headers only)
        shell: bash
        run: if [ "$RUNNER_OS" = Windows ]; then python tools/check_core_includes.py; else python3 tools/check_core_includes.py; fi
      - name: play.py puts games/slice, games/platformer and games/modules back with the same SHA-256 when a move fails second or third, a game does not start or fails, or one of them does not come back (tools/author_game/test_play.py, a tree of its own)
        shell: bash
        run: if [ "$RUNNER_OS" = Windows ]; then python -m unittest discover -v -s tools/author_game; else python3 -m unittest discover -v -s tools/author_game; fi
      - name: Python for the converters (Linux; Windows builds its own next to the editor)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/pyenv"
          "$RUNNER_TEMP/pyenv/bin/pip" install --disable-pip-version-check -r converters/requirements.txt
          echo "FORGE_PYTHON=$RUNNER_TEMP/pyenv/bin/python" >> "$GITHUB_ENV"
      - name: Converter tests (PSD, Aseprite, sound)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then py=build/python/python.exe; else py="$FORGE_PYTHON"; fi
          "$py" -m unittest discover -s converters/tests -v
      - name: Job system benchmark
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_jobs
      - name: Sandbox, 600 headless frames
        shell: bash
        run: ./${{ format(matrix.bin, 'apps/sandbox') }}/forge_sandbox --headless 600
      - name: World streaming benchmark (64k x 64k, 10 s flight)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_world --frames 600
      - name: Scene benchmark (200k entities in chunks)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_scene
      - name: Sprite batch benchmark (1M sprites, CPU side)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_sprites --frames 100
      - name: Simulation benchmark (200k creatures with logic, bodies, triggers)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_sim --frames 300
      - name: Factory benchmark (10 000 always-on production blocks)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_factory --ticks 300
      - name: Script benchmark (10 000 scripted objects)
        shell: bash
        run: ./${{ format(matrix.bin, 'bench') }}/forge_bench_script --frames 300
      - name: World demo, 600 headless frames
        shell: bash
        run: ./${{ format(matrix.bin, 'apps/world_demo') }}/forge_world_demo --headless 600
      - name: Render the world offscreen (software Vulkan)
        if: runner.os == 'Linux'
        run: |
          ./build/apps/world_demo/forge_world_demo --screenshot world-side.png
          ./build/apps/world_demo/forge_world_demo --topdown --screenshot world-top.png
          ./build/apps/render_demo/forge_render_demo --day --sprites 20000 --particles 4000 --zoom 32 --screenshot world-sprites.png
          ./build/apps/render_demo/forge_render_demo --sprites 20000 --particles 4000 --zoom 16 --screenshot world-night.png
          ./build/apps/sim_demo/forge_sim_demo --screenshot world-sim.png
          ./build/apps/factory_demo/forge_factory_demo --screenshot world-factory.png
          ./build/apps/script_demo/forge_script_demo --screenshot world-scripts.png
          ./build/apps/ui_demo/forge_ui_demo --screenshot world-ui-gallery.png
          ./build/apps/ui_demo/forge_ui_demo --theme fantasy --screenshot world-ui-fantasy.png
      - name: UI list of 50 000 rows scrolling (software Vulkan, checks it works, not speed)
        if: runner.os == 'Linux'
        run: ./build/apps/ui_demo/forge_ui_demo --scroll --frames 300 --screenshot world-ui-scroll.png
      - name: Editor self-test (drag, undo/redo, Play/Stop, delete, copy, convert, a new game from a template) and hierarchy of 50 500 objects
        if: runner.os == 'Linux'
        run: |
          ./build/apps/editor/forge_editor --self-test --screenshot world-editor.png
          ./build/apps/editor/forge_editor --bench --frames 300
      - name: Two games of one template (editor self-test part two-games), «Находка» made in A through the tabs, A opened again elsewhere and updated, the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test two-games
      - name: A game of several levels (editor self-test part levels), a second level made, renamed and made the start level through the menu and the window about unsaved changes, one Tiled map name in two levels kept apart byte for byte, opened again elsewhere and each level played, links «уходит через» between them made in «Логика», played through, saved and continued in another process
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test levels
      - name: A platformer made by its author (editor self-test part platformer), an enemy, a coin, spikes and a flag made and set in «Объекты» with undo and redo, put on the level, a zone «Пропасть», links «падает в» and «доходит до» in «Логика», a HUD and the windows «Показывается сам» in «Интерфейс», opened again elsewhere and played as set, the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test platformer
      - name: The catalog's template «Платформер» (editor self-test part platformer-template), games/platformer made again from its sources byte for byte, A and B made of its card in the window «Новая игра», in A the hero's picture replaced in «Ресурсы», the coin's «Очки» and the beetle's «Скорость» in «Объекты», a coin and a bridge on «Луг», the exit's link in «Логика» and the win window's title in «Интерфейс» with undo and redo, opened again elsewhere and played as changed, the template and B byte for byte as before
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test platformer-template
      - name: Modules (editor self-test part modules), the editor of a game's module from the registry, two modules' levels, values, events and verbs side by side and apart, a game of the test module «Проба» and a game from before step 14.3 (no project.forge, game.json without "module", CRLF) each opened in an editor of its own from another working folder and played with «Играть», the games whose module is none, another, empty or a number refused before the open game or its undo is touched, and refused by forge_game and forge_slice
        if: runner.os == 'Linux'
        run: ./build/apps/editor/forge_editor --self-test modules
      - name: Vertical slice self-test (plays the game through, saves and loads) and stress run
        if: runner.os == 'Linux'
        run: |
          ./build/apps/slice/forge_slice --test --screenshot world-slice-village.png
          ./build/apps/slice/forge_slice --test --scene mine --screenshot world-slice-mine.png
          ./build/apps/slice/forge_slice --test --scene menu --screenshot world-slice-menu.png
          ./build/apps/slice/forge_slice --test --scene menu --size 2560x1080 --screenshot world-slice-menu-21x9.png
          ./build/apps/slice/forge_slice --stress --test --scene stress --screenshot world-slice-stress.png
          ./build/apps/slice/forge_slice --test --scene windows --screenshot world-slice-windows.png
          ./build/apps/slice/forge_slice --test --scene templates --screenshot world-slice-templates.png
          ./build/apps/slice/forge_slice --test --scene volumes
          ./build/apps/slice/forge_slice --test --scene physics --screenshot world-slice-physics.png
          ./build/apps/slice/forge_slice --test --scene light --screenshot world-slice-light.png
          ./build/apps/slice/forge_slice --test --scene light --size 1920x1080 --screenshot world-slice-light-1080p.png
          ./build/apps/slice/forge_slice --test --scene zones --screenshot world-slice-zones.png
          ./build/apps/slice/forge_slice --test --scene own_tiles --screenshot world-slice-own-tiles.png
          ./build/apps/slice/forge_slice --test --scene own_tiles --size 1920x1080 --screenshot world-slice-own-tiles-1080p.png
          ./build/apps/slice/forge_slice --test --scene tiled --screenshot world-slice-tiled.png
          ./build/apps/slice/forge_slice --test --scene tiled_update --screenshot world-slice-tiled-update.png
      - name: Package the vertical slice
        run: cmake --build build --config Release --target forge_slice_package
      - name: Packaged game finds its data, the windows and templates examples' pages, the physics, light, zones and Tiled examples' levels in it and plays a level of its own tiles
        if: runner.os == 'Linux'
        run: |
          ./build/dist/OldMine/OldMine --test --scene menu --screenshot world-slice-packaged.png
          ./build/dist/OldMine/OldMine --test --scene menu --size 1440x1080 --screenshot world-slice-packaged-4x3.png
          ./build/dist/OldMine/OldMine --test --scene windows --screenshot world-slice-packaged-windows.png
          ./build/dist/OldMine/OldMine --test --scene templates --screenshot world-slice-packaged-templates.png
          ./build/dist/OldMine/OldMine --test --scene volumes
          ./build/dist/OldMine/OldMine --test --scene physics --screenshot world-slice-packaged-physics.png
          ./build/dist/OldMine/OldMine --test --scene light --screenshot world-slice-packaged-light.png
          ./build/dist/OldMine/OldMine --test --scene light --size 1920x1080 --screenshot world-slice-packaged-light-1080p.png
          ./build/dist/OldMine/OldMine --test --scene zones --screenshot world-slice-packaged-zones.png
          ./build/dist/OldMine/OldMine --test --scene own_tiles --screenshot world-slice-packaged-own-tiles.png
          ./build/dist/OldMine/OldMine --test --scene tiled --screenshot world-slice-packaged-tiled.png
      - name: The launcher forge_game in the build, then in the package with games/slice, games/platformer and games/modules moved away («Старая шахта» from game.json; the test module «Проба»; two modules' saves in one player's folder, each run another process from another working folder - probe_save, module_slots, probe_foreign)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then game=build/apps/game/Release/forge_game.exe; packed=build/dist/OldMine/OldMine.exe; else game=build/apps/game/forge_game; packed=build/dist/OldMine/OldMine; fi
          mkdir -p build/elsewhere
          "./$game" --test --scene menu
          "./$game" --test --scene probe --data tests/data/probe/game
          (cd build/elsewhere && "../../$game" --test --scene probe_save --data ../../tests/data/probe/game --user ../module-slots-built)
          (cd build/elsewhere && "../../$game" --test --scene module_slots --user ../module-slots-built)
          (cd build/elsewhere && "../../$game" --test --scene probe_foreign --data ../../tests/data/probe/game --user ../module-slots-built)
          mv games/slice build/slice-away
          mv games/platformer build/platformer-away
          mv games/modules build/modules-away
          trap 'mv build/slice-away games/slice; mv build/platformer-away games/platformer; mv build/modules-away games/modules' EXIT
          "./$packed" --test --scene menu
          "./$packed" --test --scene probe --data tests/data/probe/game
          (cd build/elsewhere && "../../$packed" --test --scene probe_save --data ../../tests/data/probe/game --user ../module-slots-packed)
          (cd build/elsewhere && "../../$packed" --test --scene module_slots --user ../module-slots-packed)
          (cd build/elsewhere && "../../$packed" --test --scene probe_foreign --data ../../tests/data/probe/game --user ../module-slots-packed)
      - name: Going between levels in the build, then in the package with games/slice moved away (slice scenes levels, then levels_continue from another working folder)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then built=build/apps/slice/Release/forge_slice.exe; packed=build/dist/OldMine/OldMine.exe; else built=build/apps/slice/forge_slice; packed=build/dist/OldMine/OldMine; fi
          mkdir -p build/elsewhere
          "./$built" --test --scene levels
          (cd build/elsewhere && "../../$built" --test --scene levels_continue)
          mv games/slice build/slice-away
          trap 'mv build/slice-away games/slice' EXIT
          "./$packed" --test --scene levels
          (cd build/elsewhere && "../../$packed" --test --scene levels_continue)
      - name: The platformer's rules on two levels in the build, then in the package with games/slice moved away (slice scenes platformer, then platformer_continue and platformer_edges from another working folder)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then built=build/apps/slice/Release/forge_slice.exe; packed=build/dist/OldMine/OldMine.exe; else built=build/apps/slice/forge_slice; packed=build/dist/OldMine/OldMine; fi
          mkdir -p build/elsewhere
          "./$built" --test --scene platformer
          (cd build/elsewhere && "../../$built" --test --scene platformer_continue)
          (cd build/elsewhere && "../../$built" --test --scene platformer_edges)
          mv games/slice build/slice-away
          trap 'mv build/slice-away games/slice' EXIT
          "./$packed" --test --scene platformer
          (cd build/elsewhere && "../../$packed" --test --scene platformer_continue)
          (cd build/elsewhere && "../../$packed" --test --scene platformer_edges)
      - name: The template «Платформер» in the build, then in the package with games/slice, games/platformer and games/modules moved away (slice scenes platformer_template, a bot through «Луг» to «Холмы», saved there, three falls and «Ещё раз»; then platformer_template_continue from another working folder, «Продолжить», no reward twice, through «Вершина» to the flag)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then built=build/apps/slice/Release/forge_slice.exe; packed=build/dist/OldMine/OldMine.exe; else built=build/apps/slice/forge_slice; packed=build/dist/OldMine/OldMine; fi
          mkdir -p build/elsewhere
          "./$built" --test --scene platformer_template --screenshot world-slice-platformer-template.png
          (cd build/elsewhere && "../../$built" --test --scene platformer_template_continue --screenshot ../../world-slice-platformer-template-won.png)
          mv games/slice build/slice-away
          mv games/platformer build/platformer-away
          mv games/modules build/modules-away
          trap 'mv build/slice-away games/slice; mv build/platformer-away games/platformer; mv build/modules-away games/modules' EXIT
          "./$packed" --test --scene platformer_template
          (cd build/elsewhere && "../../$packed" --test --scene platformer_template_continue)
      - name: The author's games (made of a template by the editor's self-test parts new-game, two-games, levels, platformer, platformer-template and modules) play in the package, the build's forge_game and its old name forge_slice with games/slice, games/platformer and games/modules moved away (back with the same SHA-256), the game of levels from its start level and through its links, then continued from another working folder, a game from before step 14.3 as «Старая шахта», two modules' saves in one player's folder
        if: runner.os == 'Linux'
        run: python3 tools/author_game/play.py build/dist/OldMine/OldMine build/apps/game/forge_game build/apps/slice/forge_slice
      # Windows has no GPU here: the editor and the game draw with D3D12's software device (WARP), if SDL finds it.
      - name: New game from a template on Windows (editor self-test parts new-game, two-games, levels with links between levels, platformer, platformer-template and modules, each game in an editor of its own) and the games in the package, the build's forge_game and forge_slice
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./build/apps/editor/Release/forge_editor.exe --self-test new-game
          ./build/apps/editor/Release/forge_editor.exe --self-test two-games
          ./build/apps/editor/Release/forge_editor.exe --self-test levels
          ./build/apps/editor/Release/forge_editor.exe --self-test platformer
          ./build/apps/editor/Release/forge_editor.exe --self-test platformer-template
          ./build/apps/editor/Release/forge_editor.exe --self-test modules
          python tools/author_game/play.py build/dist/OldMine/OldMine.exe build/apps/game/Release/forge_game.exe build/apps/slice/Release/forge_slice.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OldMine-${{ runner.os }}
          path: build/dist/OldMine
      - name: Render sprites, particles and light offscreen (software Vulkan, checks it works, not speed)
        if: runner.os == 'Linux'
        run: ./build/apps/render_demo/forge_render_demo --bench 3 --sprites 200000 --particles 200000
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: world-screenshots
          path: world-*.png
